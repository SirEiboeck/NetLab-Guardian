<!DOCTYPE html>
<html lang="de" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="NetLab Guardian Adminbereich">
  <title>Adminbereich — NetLab Guardian</title>
  <link rel="stylesheet" href="style.css">
  <script>(()=>{try{const session=JSON.parse(sessionStorage.getItem('netlab-guardian-session-v1'));if(!session||session.role!=='admin'){location.replace('login.html');return}document.documentElement.classList.remove('auth-pending')}catch{location.replace('login.html')}})();</script>
  <noscript><meta http-equiv="refresh" content="0;url=login.html"></noscript>
  <script src="admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="header">
    <a class="brand" href="index.html" aria-label="Zur NetLab Guardian Übersicht">NetLab Guardian</a>
    <span class="admin-page-label">Adminbereich</span>
    <div class="admin-actions">
      <a class="button outline" href="index.html">Zur Übersicht</a>
      <button class="button outline" id="logoutButton" type="button">Abmelden</button>
    </div>
  </header>
  <main class="workspace admin-workspace">
    <div class="section-top">
      <div>
        <div class="eyebrow muted">GERÄTEVERWALTUNG</div>
        <h1>Adminbereich</h1>
        <p class="subtle">Geräte hinzufügen, umbenennen, einem Rack zuweisen oder entfernen.</p>
      </div>
      <button class="button light" id="addDevice" type="button">Gerät hinzufügen</button>
    </div>
    <p class="admin-note">Angemeldet als admin. Änderungen werden lokal in diesem Browser gespeichert.</p>
    <div class="admin-summary" id="adminSummary"></div>
    <div class="table-scroll admin-table-wrap">
      <table>
        <thead><tr><th>Gerät</th><th>Typ / Modell</th><th>IP-Adresse</th><th>Rack</th><th>Höheneinheit</th><th>Aktionen</th></tr></thead>
        <tbody id="adminTable"></tbody>
      </table>
    </div>
  </main>
  <dialog id="adminDialog">
    <div class="dialog-top"><span class="eyebrow muted" id="adminDialogEyebrow">ADMINBEREICH</span><button class="close" type="button" aria-label="Dialog schließen">×</button></div>
    <div id="adminDialogContent"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
